# Same as compose.external-postgres.yml but WITHOUT the migration container.
# Use this when you run migrations on the HOST (see README) because the container
# cannot reach your Postgres (e.g. P1010). Run migrations once on the host, then:
#   docker compose -f compose.external-postgres-no-migration.yml up -d

name: affine
services:
  affine:
    image: ${AFFINE_IMAGE:-ghcr.io/toeverything/affine:stable}
    container_name: affine_server
    ports:
      - '${PORT:-3010}:3010'
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ${UPLOAD_LOCATION}:/root/.affine/storage
      - ${CONFIG_LOCATION}:/root/.affine/config
    env_file:
      - .env
    environment:
      - REDIS_SERVER_HOST=redis
      - DATABASE_URL=${DATABASE_URL}
      - AFFINE_INDEXER_ENABLED=false
    restart: unless-stopped

  redis:
    image: redis
    container_name: affine_redis
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
